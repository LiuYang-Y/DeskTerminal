org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Gradle Sync 阶段的并行模型拉取不再受 org.gradle.parallel 控制，需单独开启。
org.gradle.tooling.parallel=true

# 本机 JAVA_HOME 未设置，这里显式指向已验证的 JDK 25.0.2（AGP 9.4 要求 JDK >= 17）。
# 换机器或改用 Android Studio 自带 JDK 时，删掉这一行即可。
org.gradle.java.home=D:\\java

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 默认启用内置 Kotlin，无需也不能再声明 org.jetbrains.kotlin.android。
android.builtInKotlin=true
android.newDsl=true

kotlin.code.style=official
