[versions]
# 以下四项已核实（2026-10-09 查询 Google 官方文档与 toolchain 文档）
agp = "9.4.1"
# 注意：AGP 9 内置 Kotlin，默认把 KGP 锁在 2.2.10。版本目录里写 kotlin = "2.4.x"
# 本身不会改变编译器版本——它只喂给 org.jetbrains.kotlin.plugin.compose。
# 真正生效靠根 build.gradle.kts 里 buildscript classpath 的 KGP 覆盖（向上覆盖 only）。
kotlin = "2.4.20"
composeBom = "2026.09.00"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"

compileSdk = "37"
targetSdk = "36"
minSdk = "26"
java = "17"

# 已核实（2026-10-10 查 GitHub Release）：kotlinx.coroutines 最新稳定版
coroutines = "1.11.0"

# 已核实（2026-10-11 查 Maven Central metadata）：io.github.kyant0:backdrop 最新为 2.0.1，
# 这里按需求锁 2.0.0。详见 core:ui/DeskGlass.kt 里的"为什么要排除 org.jetbrains.compose"。
backdrop = "2.0.0"

# 已核实（2026-10-11 查 repo1.maven.org/maven2 metadata）：dev.rikka.shizuku:{api,provider} 最新为 13.1.5
shizuku = "13.1.5"

# LRC / 逐字歌词解析。**不是 Google 官方 Accompanist** ——
# 是第三方 MochaRealm（github.com/6xingyv/Accompanist）的 KMP 库，Apache-2.0。
#
# 已核实（2026-10-14 直接读 Maven Central 的 .module / sources.jar，不是看网页转述）：
#   · 只有 `lyrics-core` 可用；**`lyrics-ui` 已否决**（AAR minSdk=29 > 本项目 26，
#     且 POM 里挂 8 个 org.jetbrains.compose.* —— 会重开 :core:ui 排除过的那个坑）。
#   · `lyrics-core` 是**纯解析库**：无 Android 依赖、无 Compose 依赖，
#     只带 kotlin-stdlib + kotlinx-serialization-json（后者是 runtime 作用域）。
#   · **它没有 android 变体**（lyrics-core-android → 404）。元数据里只有
#     common / jvm / native / js / wasm；Android 侧解析到的是 `jvm` 变体
#     （org.gradle.jvm.environment=standard-jvm）。这一点已用实际构建验证过。
#   · 公开 API 很小：`AutoParser().parse(text): SyncedLyrics`，
#     `SyncedLyrics.lines: List<ISyncedLine>`（start/end/duration，毫秒），
#     具体行是 `SyncedLine`（普通行）或 `KaraokeLine`（带 syllables 的逐字行）。
#
# ⚠️ 已知短板（在 LyricsParser 里补掉，不要指望库自己挡）：
#   `EnhancedLrcParser.canParse` 的正则是 `\[\d{2}:\d{2}\.\d{2,3}\]` ——
#   **只认 `[mm:ss.xx]` 这一种写法**。`[mm:ss]`、`[mm:ss:x]`（冒号当百分秒）、
#   `[m:ss.xx]`（1 位分钟）都会被判成"不认识"，AutoParser 于是返回空集
#   （不报错）。所以喂给它之前先过一层 `LrcTextNormalizer`。
accompanistLyrics = "0.5.0"

# 高德 —— **导航合包**，已整体替换掉原来的纯地图包（2026-10-12）。
#
# 为什么必须整体换、不能并存：导航 SDK 自带 3D 地图 SDK（官方"相关下载"页原文列明
# 导航包 = 定位 + 3D地图 + 导航 + 搜索），与 3dmap-location-search 同时引入会
# duplicate class（两个包都带 com.amap.api.maps.**）。
#
# 已核实（2026-10-12 查 repo1.maven.org/maven2/com/amap/api/ 的 maven-metadata.xml）：
#   com.amap.api:navi-3dmap-location-search
#   最新版 11.3.100_3dmap11.3.100_loc11.3.000_sea9.8.1，2026-09-23 发布，共 14 个版本。
#   命名规则 = 导航版本_3dmap地图版本_loc定位版本_sea搜索版本。
#   packaging 是 jar（与旧包同形）：so 在 lib/<abi>/、资源在 assets/map_assets/。
#   已解压确认（.verify/navi/）：
#     · com/amap/api/navi      468 个 class（含 AmapNaviPage / AMapNaviView / NaviSetting）
#     · com/amap/api/maps      279 个 class（AMap / MapView / MapsInitializer 都在，
#                              所以 :map 现有的地图代码与隐私闸门无需改动）
#     · com/amap/api/location / services（定位 + 搜索）
#     · lib/arm64-v8a 与 lib/armeabi-v7a 各 7 个 so
#
# 旧坐标 10.1.300_loc6.4.9_sea9.7.4 已不再使用（保留在此仅作对照，不要再引用）。
# 换包后的回归验证结论见 map/build.gradle.kts 与 README。
amap = "11.3.100_3dmap11.3.100_loc11.3.000_sea9.8.1"

# TODO(step-2): 以下依赖版本尚未核实，首次 sync 时按 IDE 提示补全后再写入
# room-runtime + room-ktx + ksp（:core:data 持久化）
# media3-exoplayer（:feature:music）
# datastore-preferences（:feature:settings）
# okhttp/retrofit（:feature:weather）

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

kyant-backdrop = { group = "io.github.kyant0", name = "backdrop", version.ref = "backdrop" }

# 歌词解析（纯 JVM/KMP，解析 LRC / Enhanced LRC / TTML / KRC）。
# 用它的**唯一**理由是 Enhanced LRC 的**逐字**（音节级）解析 —— 那部分自己写不划算。
# 界面上不出现它的任何类型：全部在 LyricsParser 里转成本项目的 LyricsDoc。
accompanist-lyrics-core = { group = "com.mocharealm.accompanist", name = "lyrics-core", version.ref = "accompanistLyrics" }

# 仪器化测试（androidTest）。版本取的是 2024 年就存在的稳定版 ——
# 这台机器的场景只需要"能跑 Compose UI 测试"，不需要最新特性。
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version = "1.2.1" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.6.2" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# JVM 单元测试（test/ 源码集）。用于盯着纯函数的推导 —— 比如音乐页的
# "歌词块与 HUD 不重叠"不变式，以及 LRC 时间戳归一化的各种方言。
junit = { group = "junit", name = "junit", version = "4.13.2" }

rikka-shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
rikka-shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }

# 导航合包 = 导航 + 3D地图 + 定位 + 搜索（四个能力一个 jar，不能与纯地图包并存）。
amap-navi = { group = "com.amap.api", name = "navi-3dmap-location-search", version.ref = "amap" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
