[versions]
# 以下四项已核实（2026-10-09 查询 Google 官方文档与 toolchain 文档）
agp = "9.4.1"
# 注意：AGP 9 内置 Kotlin，默认把 KGP 锁在 2.2.10。版本目录里写 kotlin = "2.4.x"
# 本身不会改变编译器版本——它只喂给 org.jetbrains.kotlin.plugin.compose。
# 真正生效靠根 build.gradle.kts 里 buildscript classpath 的 KGP 覆盖（向上覆盖 only）。
kotlin = "2.4.20"
composeBom = "2026.09.00"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"

compileSdk = "37"
targetSdk = "36"
minSdk = "26"
java = "17"

# 已核实（2026-10-10 查 GitHub Release）：kotlinx.coroutines 最新稳定版
coroutines = "1.11.0"

# 已核实（2026-10-11 查 Maven Central metadata）：io.github.kyant0:backdrop 最新为 2.0.1，
# 这里按需求锁 2.0.0。详见 core:ui/DeskGlass.kt 里的"为什么要排除 org.jetbrains.compose"。
backdrop = "2.0.0"

# 已核实（2026-10-11 查 repo1.maven.org/maven2 metadata）：dev.rikka.shizuku:{api,provider} 最新为 13.1.5
shizuku = "13.1.5"

# 高德 —— **导航合包**，已整体替换掉原来的纯地图包（2026-10-12）。
#
# 为什么必须整体换、不能并存：导航 SDK 自带 3D 地图 SDK（官方"相关下载"页原文列明
# 导航包 = 定位 + 3D地图 + 导航 + 搜索），与 3dmap-location-search 同时引入会
# duplicate class（两个包都带 com.amap.api.maps.**）。
#
# 已核实（2026-10-12 查 repo1.maven.org/maven2/com/amap/api/ 的 maven-metadata.xml）：
#   com.amap.api:navi-3dmap-location-search
#   最新版 11.3.100_3dmap11.3.100_loc11.3.000_sea9.8.1，2026-09-23 发布，共 14 个版本。
#   命名规则 = 导航版本_3dmap地图版本_loc定位版本_sea搜索版本。
#   packaging 是 jar（与旧包同形）：so 在 lib/<abi>/、资源在 assets/map_assets/。
#   已解压确认（.verify/navi/）：
#     · com/amap/api/navi      468 个 class（含 AmapNaviPage / AMapNaviView / NaviSetting）
#     · com/amap/api/maps      279 个 class（AMap / MapView / MapsInitializer 都在，
#                              所以 :map 现有的地图代码与隐私闸门无需改动）
#     · com/amap/api/location / services（定位 + 搜索）
#     · lib/arm64-v8a 与 lib/armeabi-v7a 各 7 个 so
#
# 旧坐标 10.1.300_loc6.4.9_sea9.7.4 已不再使用（保留在此仅作对照，不要再引用）。
# 换包后的回归验证结论见 map/build.gradle.kts 与 README。
amap = "11.3.100_3dmap11.3.100_loc11.3.000_sea9.8.1"

# TODO(step-2): 以下依赖版本尚未核实，首次 sync 时按 IDE 提示补全后再写入
# room-runtime + room-ktx + ksp（:core:data 持久化）
# media3-exoplayer（:feature:music）
# datastore-preferences（:feature:settings）
# okhttp/retrofit（:feature:weather）

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

kyant-backdrop = { group = "io.github.kyant0", name = "backdrop", version.ref = "backdrop" }

rikka-shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
rikka-shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }

# 导航合包 = 导航 + 3D地图 + 定位 + 搜索（四个能力一个 jar，不能与纯地图包并存）。
amap-navi = { group = "com.amap.api", name = "navi-3dmap-location-search", version.ref = "amap" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
